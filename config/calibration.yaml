# IDM calibration settings.
segment_s: 30                 # non-overlapping segments, = bootstrap block (plan Section 5)
bounds:                       # IDM parameter bounds
  v0: [5.0, 30.0]
  T: [0.1, 3.0]
  s0: [0.1, 5.0]
  a_max: [0.1, 4.0]
  b: [0.1, 5.0]
delay_steps_max: 12           # 0-1.2 s at dt = 0.1 s
collision_penalty_m: 1000.0   # added to RMSE times the share of segments with gap <= 0
de:                           # scipy differential_evolution (polish done separately)
  popsize: 15
  maxiter: 200
  tol: 1.0e-6
  seed: 0
polish: L-BFGS-B              # continuous parameters, delay fixed at the DE optimum
