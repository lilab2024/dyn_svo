# Single source of the data split and segment rules.
experiments: [A, B, C, D, E, F, G, H]
roles:
  dev: [A, C, E, F, G]
  test: [B, D, H]          # locked until the final frozen rerun
cv: leave_one_experiment_out   # inside dev only
segments:
  drop_first_s: 30                         # R1
  intervention_s: {F: 59, G: 312, H: 191}  # human intervention by veh 20
  exclude_follower_after_intervention: [20]  # R2
fuel:
  unit: L/h
  usage: interval_average_only             # R4
  missing_full: {D: [5, 6], H: [4, 11]}    # re-checked on load
ring_length_nominal_m: 260
instruction_regime: {A: I, B: I, C: I, D: I, E: I, F: II, G: II, H: II}   # Wu et al. 2019, Table 1
